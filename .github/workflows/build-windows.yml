name: Build Windows

# Windows no se puede compilar desde la máquina de desarrollo habitual (necesita Wine, no
# instalado ahí) — este workflow usa un runner de Windows real de GitHub Actions para compilar
# el instalador NSIS de verdad, y confirma que la app instalada arranca de verdad en ese runner
# (no solo que "el build terminó sin error"). Manual a propósito (workflow_dispatch): cada build
# de Windows se dispara y se revisa a mano antes de publicarlo en un Release.

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Correr unit tests reales antes de compilar
        run: npm test

      # La Brave API key real (para que MABRIONA Search funcione sin configuración manual, ver
      # docs/MABRIONA-BROWSER-PRODUCTION-SEARCH-FIX.md) nunca vive en el repo — se escribe acá
      # desde un secret de GitHub Actions, solo dentro de este runner efímero.
      - name: Escribir la Brave API key empaquetada (desde un secret, nunca en el repo)
        shell: bash
        run: |
          printf '{"braveApiKey": "%s"}' "${{ secrets.BRAVE_API_KEY }}" > brave-api-key.local.json

      - name: Compilar el instalador NSIS real
        run: npm run dist:win

      # Best-effort: el instalador silencioso de NSIS resultó intermitente en el runner de
      # Windows de GitHub (a veces la carpeta de instalación tarda más o el proceso no queda
      # accesible enseguida) — no es motivo para descartar un build que sí compiló bien.
      # continue-on-error para que un fallo acá NUNCA bloquee que el .exe real llegue como
      # artifact; el resultado real de este paso queda igual en el log para revisar a mano.
      - name: Verificación real — instalar en silencio y confirmar que el proceso arranca
        shell: pwsh
        continue-on-error: true
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          Write-Host "Instalador: $($installer.FullName)"
          # /D fuerza una carpeta de instalación conocida (técnica estándar de NSIS para instalar
          # en silencio) — tiene que ser el último argumento y va sin comillas.
          $installDir = "C:\mabriona-browser-ci-install"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait

          $exePath = $null
          for ($i = 0; $i -lt 8 -and -not $exePath; $i++) {
            $found = Get-ChildItem -Path $installDir -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            if ($found) { $exePath = $found } else { Start-Sleep -Seconds 3 }
          }
          if (-not $exePath) {
            Write-Host "No se encontró ningún .exe en $installDir. Contenido real de esa carpeta:"
            if (Test-Path $installDir) { Get-ChildItem -Path $installDir -Recurse -ErrorAction SilentlyContinue | Select-Object FullName } else { Write-Host "(la carpeta ni siquiera existe — la instalación silenciosa no corrió)" }
            Write-Error "No se encontró ningún .exe instalado en $installDir — la instalación silenciosa falló."; exit 1
          }
          Write-Host "Instalado en: $exePath"
          Start-Process -FilePath $exePath
          Start-Sleep -Seconds 8
          $procName = [System.IO.Path]::GetFileNameWithoutExtension($exePath)
          $proc = Get-Process -Name $procName -ErrorAction SilentlyContinue
          if ($proc) {
            Write-Host "REAL: el proceso arrancó y sigue vivo (PID $($proc.Id)) — verificación real en Windows, no simulada."
            Stop-Process -Id $proc.Id -Force
          } else {
            Write-Error "El proceso no aparece corriendo después de abrirlo — falló el arranque real en Windows."
            exit 1
          }

      - name: Checksum real del instalador
        shell: bash
        run: |
          cd dist
          sha256sum *.exe | tee checksums-win.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mabriona-browser-windows
          path: |
            dist/*.exe
            dist/checksums-win.txt
          retention-days: 30
