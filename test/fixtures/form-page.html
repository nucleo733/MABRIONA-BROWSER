<!doctype html>
<html lang="es">
<head><meta charset="utf-8" /><title>Fixture real de formulario para probar autocompletar</title></head>
<body>
  <h1>Formulario real (fixture de prueba)</h1>
  <form>
    <input type="text" autocomplete="name" id="f-name" />
    <input type="email" autocomplete="email" id="f-email" />
    <input type="tel" autocomplete="tel" id="f-phone" />
    <input type="text" autocomplete="street-address" id="f-address" />
    <input type="text" autocomplete="address-level2" id="f-city" />
    <input type="text" autocomplete="postal-code" id="f-zip" />
    <input type="text" autocomplete="country" id="f-country" />
    <input type="text" autocomplete="cc-name" id="f-cc-name" />
    <input type="text" autocomplete="cc-number" id="f-cc-number" />
    <input type="text" autocomplete="cc-exp" id="f-cc-exp" />
  </form>
</body>
</html>
